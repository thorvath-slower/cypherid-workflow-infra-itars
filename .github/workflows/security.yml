name: security

# Security scanning suite for cypherid-workflow-infra (ITARS, CZID-259). Mirrors the
# refactor-line IaC suite (improvement-#010 / CZID-98 pins) plus Python SAST for the
# chalice lambdas + glue jobs. Self-contained: ubuntu-latest, no customer infra.
#   - gitleaks : secret scan over git history — HARD-FAIL (reviewed FPs → .gitleaks.toml)
#   - trivy    : vuln + IaC misconfig + secret (fs) — REPORT-ONLY first pass; ratchet
#                exit-code to 1 once the HIGH/CRITICAL backlog is triaged (.trivyignore)
#   - tflint   : Terraform lint — fail on errors, report warnings
#   - codeql   : Python SAST (lambdas/, glue_jobs/) — results to the Security tab
#   - checkov  : deep IaC policy pass — OPT-IN (workflow_dispatch), report-only

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_checkov:
        description: "Also run the full Checkov policy pass (full-suite / prod check)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (secrets, hard-fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan git history for secrets
        run: gitleaks git . --redact --no-banner --exit-code 1

  trivy:
    name: trivy fs (vuln/misconfig/secret, report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 0 # TODO(CZID-259): ratchet to 1 once the HIGH/CRITICAL backlog is triaged

  tflint:
    name: tflint (report-only pending CZID-263)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      # Report-only for now: `tflint --recursive` hard-errors on a PRE-EXISTING broken
      # module reference — terraform/idseq.tf declares ./modules/taxon-indexing-eviction
      # which is missing from the repo (CZID-263). Ratchet back to hard-fail (drop
      # continue-on-error) once that module reference is fixed.
      - run: tflint --recursive --minimum-failure-severity=error --format compact
        continue-on-error: true

  codeql:
    name: CodeQL (Python SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  checkov:
    name: checkov (deep IaC policy, opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_checkov }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: cli
