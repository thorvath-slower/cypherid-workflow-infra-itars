name: security

# Security scanning suite for cypherid-workflow-infra (ITARS, CZID-259). Mirrors the
# refactor-line IaC suite (improvement-#010 / CZID-98 pins) plus Python SAST for the
# chalice lambdas + glue jobs. Self-contained: ubuntu-latest, no customer infra.
#   - gitleaks : secret scan over git history — HARD-FAIL (reviewed FPs → .gitleaks.toml)
#   - trivy    : vuln + IaC misconfig + secret (fs) — REPORT-ONLY first pass; ratchet
#                exit-code to 1 once the HIGH/CRITICAL backlog is triaged (.trivyignore)
#   - tflint   : Terraform lint — fail on errors, report warnings
#   - codeql   : Python SAST (lambdas/, glue_jobs/) — results to the Security tab
#   - checkov  : deep IaC policy pass — OPT-IN (workflow_dispatch), report-only

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (secrets, hard-fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan git history for secrets
        run: gitleaks git . --redact --no-banner --exit-code 1

  trivy:
    name: trivy fs (vuln/misconfig/secret, report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 0 # TODO(CZID-259): ratchet to 1 once the HIGH/CRITICAL backlog is triaged

  tflint:
    name: tflint (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      # Report-only: `tflint --recursive` errors on the Chalice-lambda modules that
      # terraform/idseq.tf references — ./modules/{taxon-indexing-eviction,
      # pipeline-monitor-restarter,sfn-io-helper}. Those dirs are NOT missing/broken:
      # they are generated at build time by `make package-lambdas` (chalice package ->
      # terraform/modules/<name>/chalice.tf.json) and are intentionally uncommitted.
      # This job only runs `checkout`, not `make package-lambdas`, so tflint can't
      # resolve them. Not a real defect (CZID-263 closed as a false positive). To make
      # this hard-fail, run `make package-lambdas` first (needs Docker + chalice) or
      # scope tflint to the committed modules.
      - run: tflint --recursive --minimum-failure-severity=error --format compact
        continue-on-error: true

  codeql:
    name: CodeQL (Python SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  checkov:
    name: checkov (IaC policy, hard-fail on NEW)
    # Runs on every push/PR — the deep IaC policy scanner. The first-pass backlog
    # (inherited CZI AWS-hardening posture, out of scope to remediate under D3/no-apply)
    # is accepted via .checkov.baseline (CZID-264); soft_fail=false means only NEW
    # misconfigs vs the baseline hard-fail the build. checkov scans local Terraform and
    # does NOT download remote modules, so no SSH/module-resolution issues. checkov_version
    # is pinned to match the version the baseline was generated with (bump forward
    # deliberately, then regenerate the baseline).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          checkov_version: 3.3.0
          baseline: .checkov.baseline
          soft_fail: false # hard-fail on findings new since the baseline
          output_format: cli
